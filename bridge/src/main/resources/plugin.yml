name: DbsdwBridge
version: '${version}'
main: be.dbsdw.minigames.bridge.BridgePlugin
api-version: '26.3'
folia-supported: true
depend: [AuthMe]
softdepend: [floodgate, ViaVersion]
description: Sends DBSDW survival players to the minigame server and logs them back in with a signed ticket.
permissions:
  minigames.admin:
    description: Place and remove the minigames NPC.
    default: op
