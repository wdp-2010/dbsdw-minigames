# MinigameCore

survival:
  # Public survival address players are sent back to.
  host: "play.dbsdw.com"
  port: 25565

# Shared secret for transfer tickets. Generated on first start if empty.
# Copy it to plugins/DbsdwBridge/config.yml on the survival server. Never share it.
ticket-secret: ""

# Lobby spawn, set in-game with /mg setlobby.
lobby:
  world: ""
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

queue:
  # Countdown once enough players are queued and an arena is free.
  countdown-seconds: 15
  # Shorter countdown once the queue is full.
  full-countdown-seconds: 10

arenas:
  # Template arenas (/mg arena copies <n>) get a fresh copy per match, built in a row east of the
  # template this many blocks apart, so players on one copy do not see the others.
  copy-spacing: 512

match:
  # How long the results show before everyone returns to the lobby.
  results-seconds: 10

# Simple Voice Chat during matches (only when the voicechat plugin is installed):
#   team   - every team talks in its own closed group (default)
#   all    - the whole match in one closed group
#   nearby - no groups, normal proximity voice chat
# Public queue matches use this; new rooms start with it and the host can change it in the room menu.
voice:
  rule: team

# Required resource pack, served by MinigameCore itself over HTTP.
# Put the zip at plugins/MinigameCore/<file>. With an empty public-url or no file, players join without a pack.
pack:
  file: "pack.zip"
  bind: "0.0.0.0"
  # Second port of the minigame server (Pterodactyl allocation).
  port: 25600
  # Base URL players download from, e.g. "http://62.83.125.228:25600" (no trailing path).
  public-url: ""

# Lobby leaderboards, managed with /mg leaderboard add|remove.
leaderboards: []

# Levels. XP comes from finished matches and is kept per game and for all games together.
# Reaching level n takes round(base * (n - 1) ^ exponent) XP in total.
progress:
  curve:
    base: 100
    exponent: 1.5
    max-level: 100
  xp:
    # For finishing a match, and extra for a win or a draw.
    played: 20
    win: 20
    draw: 10
    # Matches shorter than this give no XP.
    min-seconds: 60
    # Multiplier for matches with bots (0 to 1).
    bot-factor: 0.25
