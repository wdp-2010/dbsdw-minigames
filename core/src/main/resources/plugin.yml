name: MinigameCore
version: '${version}'
main: be.dbsdw.minigames.core.MinigameCorePlugin
api-version: '26.3'
description: Shared lobby, queue, team, arena, stats and resource pack services for DBSDW minigames.
# Simple Voice Chat (optional): team voice groups during matches.
softdepend: [voicechat]
permissions:
  minigames.admin:
    description: Arena, lobby and NPC setup with /mg.
    default: op
