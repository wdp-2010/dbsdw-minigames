# Player messages (MiniMessage format).
# Raise "version" when texts change: servers with an older file get it backed up and replaced.
# Colours: khaki #D9C78F (headings), field green #9CC05A (good news), amber #FFB52E (alerts, numbers).
version: 5

no-ticket: "<red>Je kunt hier alleen binnenkomen via survival.<newline><gray>Typ daar <white>/minigames</white>."
unavailable: "<red>De minigames zijn even dicht. Probeer het straks opnieuw."
survival-unavailable: "<red>Survival is even niet bereikbaar. Probeer het straks opnieuw."
to-survival: "<#9CC05A>Terug naar survival..."
shutdown: "<#FFB52E>De minigameserver herstart. Tot zo!"

# Teams (by index)
team:
  "0": "<red>Rood</red>"
  "1": "<blue>Blauw</blue>"
  "2": "<green>Groen</green>"
  "3": "<yellow>Geel</yellow>"

# Lobby items
item:
  games: "<#D9C78F><bold>Spellen</bold></#D9C78F> <gray>· rechtsklik"
  stats: "<#D9C78F><bold>Statistieken</bold></#D9C78F> <gray>· rechtsklik"
  survival: "<#9CC05A><bold>Terug naar survival</bold></#9CC05A> <gray>· rechtsklik"
  room: "<#D9C78F><bold>Speel met vrienden</bold></#D9C78F> <gray>· rechtsklik"

leave:
  nothing: "<gray>Je zit niet in een wachtrij of spel."

# Queue menus. The <font:dbsdw:menu> part draws the pack's menu background behind the chest
# (\uF800 and \uF801 are negative spaces that line it up); keep it at the start of each title.
menu:
  games:
    title: "<font:dbsdw:menu><white>\uF800\uE100\uF801</white></font><#D9C78F>Kies je missie"
  modes:
    title: "<font:dbsdw:menu><white>\uF800\uE100\uF801</white></font><game>"
  mode:
    queued: "<gray>Wachtrij: <white><queued></white>/<white><needed></white> spelers"
    countdown: "<#FFB52E>Start over <white><seconds></white>s"
    no-arena: "<red>Geen veld vrij"
    click-join: "<#9CC05A>▶ Klik om mee te doen"
    click-leave: "<red>✖ Klik om de wachtrij te verlaten"

queue:
  joined: "<#9CC05A>Je staat in de wachtrij voor <white><mode></white>."
  left: "<gray>Je bent uit de wachtrij."
  moved: "<#9CC05A>Je wacht nu op <white><mode></white>."
  cancelled: "<red>Te weinig spelers: het aftellen stopt."
  waiting: "<#FFB52E>Genoeg spelers! Wachten op een vrij veld..."
  closed: "<red>Dit spel is even dicht; je bent uit de wachtrij gehaald."
  # Action bar in the lobby while waiting in a queue.
  bar: "<gray>Wachtrij <white><mode></white> <dark_gray>·</dark_gray> <white><queued></white><gray>/<white><needed></white> <gray>spelers"
  bar-countdown: "<white><mode></white> <dark_gray>·</dark_gray> <#FFB52E>start over <white><seconds></white>s"
  countdown:
    title: "<#FFB52E><bold><seconds>"
    subtitle: "<gray>Maak je klaar..."

match:
  start: "<#9CC05A><bold>GO GO GO!"
  start-team: "<gray>Jij vecht voor team <team>"
  win: "<team> <#FFB52E><bold>wint!"
  draw: "<#FFB52E><bold>Gelijkspel!"
  won-sub: "<#9CC05A>Missie geslaagd. Goed geschoten!"
  lost-sub: "<gray>Missie mislukt... volgende keer beter."
  draw-sub: "<gray>Niemand wint deze keer."
  # The other team left the match (all its players gone); <team> is that team.
  forfeit-sub: "<team> <gray>gaf op · <#9CC05A>missie geslaagd!"
  forfeit-line: "<#FFB52E>»</#FFB52E> <team> <gray>gaf op: niemand van hen is nog in het spel."
  error: "<red>Er ging iets mis met dit spel. Je bent terug in de lobby."
  # The game stopped without a result, to be continued later (e.g. a saved chess game).
  paused: "<#FFB52E><bold>Gepauzeerd"
  paused-sub: "<gray>Geen uitslag · je speelt later verder."

# Resource pack
pack:
  prompt: "<#D9C78F>De minigames gebruiken een eigen resourcepack (geweer, geluiden, HUD)."
  declined: "<red>Zonder de resourcepack kun je niet meedoen.<newline><gray>Zet <white>Server Resource Packs</white> aan bij de serverinstellingen en probeer opnieuw via <white>/minigames</white>."
  failed: "<red>De resourcepack kon niet geladen worden.<newline><gray>Probeer opnieuw via <white>/minigames</white> op survival."

# Stats
stats:
  unavailable: "<red>Statistieken zijn even niet beschikbaar."
  usage: "<gray>Gebruik: <white>/stats <speler>"
  none: "<gray><player> heeft nog geen statistieken."
  header: "<#D9C78F><bold>Statistieken van <player>"
  game: "<#9CC05A><game>"
  line: "<gray>  <stat>: <white><value>"
  top-usage: "<gray>Gebruik: <white>/top <statistiek> [spel]"
  unknown-stat: "<red>Onbekende statistiek: <stat>"
  top-header: "<#D9C78F><bold>Top 10 · <stat></bold> <gray>(<game><gray>)"
  top-line: "<gray> <rank>. <white><player></white> <dark_gray>·</dark_gray> <#FFB52E><value>"
  top-empty: "<gray>Nog niemand."
  name:
    matches: "Gespeeld"
    wins: "Gewonnen"
    losses: "Verloren"
    draws: "Gelijkspel"

leaderboard:
  loading: "<gray>Ranglijst laden..."
  title: "<#D9C78F><bold>Top <stat></bold><newline><gray><game>"
  line: "<gray><rank>. <white><player></white> <#FFB52E><value>"
  empty: "<gray>Nog niemand"

# Private rooms (/room). <player> and <host> are player names.
room:
  created: "<#9CC05A>Je room is klaar. <gray>Nodig vrienden uit met <white>Uitnodigen</white> of <white>/room invite <speler></white>."
  invite-sent: "<#9CC05A>Uitnodiging gestuurd naar <white><player></white>. <dark_gray>(60 s geldig)"
  # <join> is the clickable button below.
  invited: "<#D9C78F><player></#D9C78F> <gray>nodigt je uit voor een room. <join> <dark_gray>(60 s)"
  join-button: "<#9CC05A><bold>[Meedoen]</bold>"
  join-hover: "<gray>Klik om mee te doen"
  joined: "<#9CC05A>Je zit in de room van <white><host></white>."
  member-joined: "<#9CC05A>»</#9CC05A> <white><player></white> <gray>doet mee."
  left: "<gray>Je hebt de room verlaten."
  member-left: "<gray>» <white><player></white> heeft de room verlaten."
  kicked: "<red>Je bent uit de room gezet."
  new-host: "<#FFB52E>»</#FFB52E> <white><player></white> <gray>is nu de host."
  back: "<#9CC05A>Terug in de room van <white><host></white>. <gray>De host kan opnieuw starten."
  start-failed: "<red>Het spel kon niet starten. Probeer opnieuw."
  wait-match: "<gray>Je room is aan het spelen. Je doet mee bij het volgende spel."
  in-room: "<gray>Je zit in een room. Verlaat hem eerst met <white>/room leave</white>."
  cancelled: "<red>Het aftellen is gestopt."
  usage: "<gray>Gebruik: <white>/room [invite|join|leave|kick|start] [speler]"
  no-player: "<red>Speler <white><player></white> is niet online."
  error:
    no-room: "<red>Je zit niet in een room."
    not-host: "<red>Alleen de host kan dat."
    in-room: "<red>Al in een room."
    no-invite: "<red>Je hebt geen geldige uitnodiging voor die room."
    not-member: "<red>Die speler zit niet in je room."
    full: "<red>De room is vol voor deze modus."
    team-full: "<red>Dat team is vol."
    too-few: "<red>Je hebt minstens 2 spelers nodig."
    empty-team: "<red>Elk team heeft minstens 1 speler nodig."
    busy: "<red>Die map is bezet. Kies een andere of probeer zo opnieuw."
    no-arena: "<red>Alle maps zijn bezet. Probeer zo opnieuw."
    playing: "<red>Je room is aan het spelen."
    counting: "<red>Het spel start al."
    not-allowed: "<red>Dat kan niet met deze teamregel."
  menu:
    title: "<#D9C78F>Room van <host>"
    mode-selected: "<#9CC05A>✔ Gekozen"
    mode-click: "<gray>Klik om te kiezen"
    map: "<#D9C78F>Map: <white><map>"
    map-random: "willekeurig"
    rule: "<#D9C78F>Teams: <white><rule>"
    rule-pick: "Spelers kiezen"
    rule-host: "Host verdeelt"
    rule-random: "Willekeurig"
    host-click: "<gray>Klik om te wisselen (host)"
    team-count: "<gray><count>/<max> spelers"
    team-click: "<#9CC05A>Klik om in dit team te gaan"
    team-host: "<gray>De host verdeelt de teams"
    team-random: "<gray>Teams worden willekeurig gemaakt"
    none: "<gray>Geen team"
    none-click: "<gray>Klik om geen team te kiezen"
    none-lore: "<gray>Wie geen team heeft, vult het kleinste team aan"
    member-host: "<#FFB52E>Host"
    member-move: "<gray>Klik om naar een ander team te zetten"
    invite: "<#9CC05A>Uitnodigen"
    invite-lore: "<gray>Kies een speler die online is"
    leave: "<red>Room verlaten"
    start: "<#9CC05A><bold>▶ START"
    cancel: "<red><bold>✖ Annuleren"
    start-host-only: "<gray>Alleen de host kan starten"
    starting: "<#FFB52E>Start over <white><seconds></white>s"
    playing: "<#FFB52E>Jullie spel is bezig"
    invite-title: "<#D9C78F>Wie nodig je uit?"
    invite-empty: "<gray>Niemand om uit te nodigen"
    back: "<gray>« Terug"
