# Player messages (MiniMessage format).
no-ticket: "<red>Je kunt hier alleen binnenkomen via de survivalserver.<newline><gray>Ga naar survival en typ <white>/minigames</white>."
unavailable: "<red>De minigames zijn nu niet beschikbaar. Probeer het later opnieuw."
survival-unavailable: "<red>Survival is nu niet bereikbaar. Probeer het later opnieuw."
to-survival: "<green>Je gaat terug naar survival..."
shutdown: "<yellow>De minigameserver start opnieuw op."

# Teams (by index)
team:
  "0": "<red>Rood</red>"
  "1": "<blue>Blauw</blue>"
  "2": "<green>Groen</green>"
  "3": "<yellow>Geel</yellow>"

# Lobby items
item:
  games: "<gold><bold>Spellen</bold></gold> <gray>(rechtsklik)"
  stats: "<aqua><bold>Statistieken</bold></aqua> <gray>(rechtsklik)"
  survival: "<green><bold>Terug naar survival</bold></green> <gray>(rechtsklik)"

leave:
  nothing: "<gray>Je staat niet in een wachtrij of spel."

# Queue menus. The <font:dbsdw:menu> part draws the pack's menu background behind the chest
# (\uF800 and \uF801 are negative spaces that line it up); keep it at the start of each title.
menu:
  games:
    title: "<font:dbsdw:menu><white>\uF800\uE100\uF801</white></font><white>Kies een spel"
  modes:
    title: "<font:dbsdw:menu><white>\uF800\uE100\uF801</white></font><game>"
  mode:
    queued: "<gray><white><queued></white>/<white><needed></white> spelers in de wachtrij"
    countdown: "<yellow>Start over <white><seconds></white> s"
    no-arena: "<red>Geen arena beschikbaar"
    click-join: "<green>Klik om mee te doen"
    click-leave: "<red>Klik om de wachtrij te verlaten"

queue:
  joined: "<green>Je staat in de wachtrij voor <white><mode></white>."
  left: "<gray>Je hebt de wachtrij verlaten."
  moved: "<green>Je staat nu in de wachtrij voor <white><mode></white>."
  cancelled: "<red>Te weinig spelers: het aftellen is gestopt."
  waiting: "<yellow>Genoeg spelers! Wachten op een vrije arena..."
  closed: "<red>Dit spel is nu niet beschikbaar; je bent uit de wachtrij gehaald."
  countdown:
    title: "<yellow><seconds>"
    subtitle: "<gray>Het spel begint bijna"

match:
  start: "<green><bold>Start!"
  start-team: "<gray>Jij zit in team <team>"
  win: "<team> <gold>wint!"
  draw: "<yellow>Gelijkspel!"
  error: "<red>Er ging iets mis met dit spel. Je bent terug in de lobby."

# Resource pack
pack:
  prompt: "<gold>Deze server gebruikt een eigen resourcepack voor de minigames."
  declined: "<red>Je hebt de resourcepack nodig om de minigames te spelen.<newline><gray>Zet <white>Server Resource Packs</white> aan bij de serverinstellingen en probeer opnieuw via <white>/minigames</white>."
  failed: "<red>De resourcepack kon niet geladen worden.<newline><gray>Probeer opnieuw via <white>/minigames</white> op survival."

# Stats
stats:
  unavailable: "<red>Statistieken zijn nu niet beschikbaar."
  usage: "<gray>Gebruik: /stats <speler>"
  none: "<gray><player> heeft nog geen statistieken."
  header: "<gold><bold>Statistieken van <player>"
  game: "<aqua><game>"
  line: "<gray>  <stat>: <white><value>"
  top-usage: "<gray>Gebruik: /top <statistiek> [spel]"
  unknown-stat: "<red>Onbekende statistiek: <stat>"
  top-header: "<gold><bold>Top 10 <stat></bold> <gray>(<game><gray>)"
  top-line: "<gray><rank>. <white><player></white> - <yellow><value>"
  top-empty: "<gray>Nog niemand."
  name:
    matches: "Gespeeld"
    wins: "Gewonnen"
    losses: "Verloren"
    draws: "Gelijkspel"

leaderboard:
  loading: "<gray>Ranglijst laden..."
  title: "<gold><bold>Top <stat></bold><newline><gray><game>"
  line: "<gray><rank>. <white><player></white> <yellow><value>"
  empty: "<gray>Nog niemand"
