# Paintball player messages (MiniMessage format).
# Raise "version" when texts change: servers with an older file get it backed up and replaced.
# Colours: khaki #D9C78F (headings), field green #9CC05A (good news), amber #FFB52E (alerts, numbers).
version: 10

game:
  name: "<#D9C78F><bold>Paintball"

# Mode names in the queue menus.
mode:
  tdm: "<#D9C78F>Teamgevecht"
  ctf: "<#D9C78F>Vlagroof"
  bomb: "<#D9C78F>Verfbom <#FFB52E>· rondes"

# The shop a room's host can switch on for team deathmatch and capture the flag (room menu button).
room-option:
  shop: "<#FFB52E>Winkel"
  shop-lore: "<gray>Koop granaten, vesten en meer met geld uit de match"

item:
  gun: "<#D9C78F><bold>Paintgeweer</bold></#D9C78F> <gray>· rechtsklik om te vuren"
  shop: "<#FFB52E><bold>Winkel</bold></#FFB52E> <gray>· rechtsklik om te openen"
  practice-gun: "<#D9C78F><bold>Oefengeweer</bold></#D9C78F> <gray>· rechtsklik om te vuren"

# Icons come from the resource pack font dbsdw:hud: \uE000 paint drop (used in code), \uE001 shield,
# \uE002-\uE005 power-ups, \uE006 hit marker, \uE007 spawn protection, \uE008 team splat.
hud:
  title-tdm: "<#D9C78F><bold>PAINTBALL</bold> <gray>· Teamgevecht"
  title-ctf: "<#D9C78F><bold>PAINTBALL</bold> <gray>· Vlagroof"
  score: "<team><gray>: <white><bold><score></bold><dark_gray>/<goal>"
  time: "<gray>Tijd <white><time>"
  bossbar: "<#D9C78F>Nog <white><time></white> te gaan"
  protected: " <font:dbsdw:hud><white>\uE007</white></font> <aqua>Beschermd"
  shield: " <font:dbsdw:hud><white>\uE001</white></font>"
  buff: " <icon> <white><seconds>s"
  # Shop modes: the player's cash; bomb mode: shown to whoever carries the bomb.
  cash: " <#9CC05A>⛁ <cash>"
  bomb: " <#FFB52E><bold>[BOM]"
  # Under the crosshair (subtitle) for the shooter.
  marker: "<font:dbsdw:hud><white>\uE006</white></font> <white><bold>RAAK!"
  marker-shield: "<font:dbsdw:hud><white>\uE001</white></font> <aqua><bold>SCHILD KAPOT!"
  eliminated: "<font:dbsdw:hud><white>\uE006</white></font> <#FFB52E><bold>UITGESCHAKELD</bold></#FFB52E> <white><victim>"
  streak: "<font:dbsdw:hud><white>\uE006</white></font> <#FFB52E><bold>OP DREEF!</bold></#FFB52E> <white><count></white> <gray>op rij"
  # Scope zoom level after a mouse-wheel notch while aiming.
  zoom: "<#D9C78F>Zoom <white><bold><level></bold></white><dark_gray>/<levels>"

out:
  title: "<red><bold>GERAAKT!"
  subtitle: "<gray>Terug in het veld over <white><seconds></white>s"

feed:
  out: "<dark_gray>✖</dark_gray> <shooter> <gray>schakelt</gray> <victim> <gray>uit"
  out-bounds: "<dark_gray>✖</dark_gray> <victim> <gray>liep het veld uit"

# Eliminations in a row without going out (3, 5, 10, ...).
streak:
  on-fire: "<#FFB52E>»</#FFB52E> <player> <gray>is</gray> <#FFB52E><bold>op dreef</bold></#FFB52E><gray>: <white><count></white> op rij!"
  unstoppable: "<#FFB52E>»</#FFB52E> <player> <gray>is</gray> <red><bold>niet te stoppen</bold></red><gray>: <white><count></white> op rij!"
  ended: "<#FFB52E>»</#FFB52E> <player> <gray>stopt de reeks van <victim> <gray>(<white><count></white>)"

# Flag events go to chat and, short, under the crosshair of everyone in the match.
flag:
  taken: "<#FFB52E>⚑</#FFB52E> <player> <gray>steelt de vlag van <flag><gray>!"
  dropped: "<#FFB52E>⚑</#FFB52E> <gray>De vlag van <flag> <gray>ligt op de grond!"
  returned: "<#FFB52E>⚑</#FFB52E> <player> <gray>brengt de vlag van <flag> <gray>terug."
  returned-auto: "<#FFB52E>⚑</#FFB52E> <gray>De vlag van <flag> <gray>is terug op de basis."
  captured: "<#FFB52E>⚑</#FFB52E> <player> <#FFB52E><bold>verovert de vlag van</bold></#FFB52E> <flag><#FFB52E><bold>!"
  status: "<team><gray>: <state>"
  state-home: "<#9CC05A>op de basis"
  state-carried: "<#FFB52E>bij <player>"
  state-dropped: "<red>op de grond (<seconds>s)"

powerup:
  # Under the crosshair when picked up.
  picked: "<icon> <#FFB52E><bold><powerup>!"
  icon:
    rapid_fire: "<font:dbsdw:hud><white>\uE002</white></font>"
    triple_shot: "<font:dbsdw:hud><white>\uE003</white></font>"
    speed: "<font:dbsdw:hud><white>\uE004</white></font>"
    shield: "<font:dbsdw:hud><white>\uE001</white></font>"
    repair: "<font:dbsdw:hud><white>\uE005</white></font>"
  rapid_fire: "Snelvuur"
  triple_shot: "Driedubbel schot"
  speed: "Sprint"
  shield: "Schild"
  repair: "EHBO-kit"

stat:
  eliminations: "Uitgeschakeld"
  outs: "Zelf geraakt"
  hits: "Treffers"
  shots: "Schoten"
  captures: "Vlaggen veroverd"
  returns: "Vlaggen gered"
  rounds: "Rondes gewonnen"
  plants: "Bommen gelegd"
  defuses: "Bommen ontmanteld"

result:
  score-bomb: "<#D9C78F><bold>Rondes</bold></#D9C78F> <red_team> <white><bold><red></bold></white> <dark_gray>-</dark_gray> <white><bold><blue></bold></white> <blue_team>"
  score: "<#D9C78F><bold>Eindstand</bold></#D9C78F> <red_team> <white><bold><red></bold></white> <dark_gray>-</dark_gray> <white><bold><blue></bold></white> <blue_team>"
  score-ctf: "<#D9C78F><bold>Vlaggen</bold></#D9C78F> <red_team> <white><bold><red></bold></white> <dark_gray>-</dark_gray> <white><bold><blue></bold></white> <blue_team>"
  mvp: "<#FFB52E><bold>MVP</bold></#FFB52E> <name> <dark_gray>·</dark_gray> <white><count></white> <gray>uitgeschakeld, <white><hits></white> <gray>treffers"
  top-header: "<#D9C78F>Beste schutters:"
  top: "<gray> <rank>. <white><name></white> <dark_gray>·</dark_gray> <#FFB52E><count></#FFB52E> uitgeschakeld"
  # Sent to each player after the shared lines.
  you: "<#D9C78F>Jij:</#D9C78F> <white><eliminations></white> <gray>uitgeschakeld <dark_gray>·</dark_gray> <white><hits></white> <gray>treffers <dark_gray>·</dark_gray> <white><accuracy>%</white> <gray>raak <dark_gray>·</dark_gray> <gray>beste reeks <white><streak>"

# Shooting range in the lobby.
practice:
  title: "<#D9C78F><bold>OEFENTERREIN"
  hint: "<gray>Rechtsklik om te vuren · sluip om te richten · scroll om te zoomen"
  down: "<font:dbsdw:hud><white>\uE006</white></font> <#FFB52E><bold>DOELWIT NEER!"

# Playing against bots (/solo, start alone in a room, or bots the room's host adds to the teams).
# The shop (rooms with the shop on, and the bomb mode). Cash is per match: <cash> and <price> are amounts.
shop:
  title: "<#D9C78F>Winkel"
  cash: "<#9CC05A><bold>⛁ <cash>"
  cash-lore: "<gray>Verdien geld met uitschakelen en doelen"
  # Buy phase of the bomb mode, under the cash.
  buy-time: "<#FFB52E>Koopfase: nog <white><seconds></white>s"
  price: "<gray>Prijs <#9CC05A>⛁ <price>"
  owned: "<gray>In bezit <white><owned></white><dark_gray>/<max>"
  earned: "<#9CC05A>+⛁ <amount></#9CC05A> <gray><reason>"
  reason:
    elimination: "uitschakeling"
    capture: "vlag veroverd"
    return: "vlag gered"
    round-win: "ronde gewonnen"
    round-loss: "ronde verloren"
    plant: "bom gelegd"
    defuse: "bom ontmanteld"
  bought: "<#9CC05A>Gekocht:</#9CC05A> <item>"
  closed-bomb: "<red>De winkel is alleen open in de koopfase"
  check:
    ok: "<#9CC05A>Klik om te kopen"
    too_poor: "<red>Niet genoeg geld"
    maxed: "<#FFB52E>Je hebt er al genoeg"
    closed: "<red>De winkel is nu dicht"
    not_for_you: "<red>Alleen voor de verdedigers van de bom"
    not_needed: "<#FFB52E>Je bent niet geraakt"
  item:
    vest:
      name: "<#D9C78F><bold>Verfvest"
      lore: "<gray>Vangt de volgende treffer op"
      use: "<gray>Gedragen · vangt één treffer op"
    repair:
      name: "<#9CC05A><bold>EHBO-kit"
      lore: "<gray>Haalt meteen één treffer weg"
      use: "<gray>Meteen gebruikt"
    boots:
      name: "<#2EE6E0><bold>Sprintschoenen"
      lore: "<gray>Sneller lopen tot je geraakt bent"
      use: "<gray>Gedragen · sneller lopen"
    rapid_cartridge:
      name: "<#FF8A1F><bold>Snelvuurpatroon"
      lore: "<gray>Rechtsklik: 10 seconden dubbel zo snel schieten"
      use: "<gray>Rechtsklik om te gebruiken"
    triple_cartridge:
      name: "<#D93BE8><bold>Driedubbel patroon"
      lore: "<gray>Rechtsklik: 8 seconden drie ballen per schot"
      use: "<gray>Rechtsklik om te gebruiken"
    paint_grenade:
      name: "<#FF3B30><bold>Verfgranaat"
      lore: "<gray>Gooi hem: één treffer voor iedereen in de buurt"
      use: "<gray>Rechtsklik om te gooien"
    smoke_grenade:
      name: "<#A0A498><bold>Rookgranaat"
      lore: "<gray>Gooi hem: een dikke rookwolk van 9 seconden"
      use: "<gray>Rechtsklik om te gooien"
    defuse_kit:
      name: "<#9CC05A><bold>Ontmantelset"
      lore: "<gray>Verdedigers: ontmantel de bom in de helft van de tijd"
      use: "<gray>Gedragen · sneller ontmantelen"

# The bomb mode: attackers plant the paint bomb on the defenders' site, defenders stop or defuse it.
bomb:
  item: "<#FFB52E><bold>Verfbom</bold></#FFB52E> <gray>· sluip op de bomplek om te leggen"
  item-lore: "<gray>Houd hem vast en sluip op de bomplek"
  site: "<#FFB52E><bold>BOMPLEK"
  # Bomb maps have two sites, A and B.
  site-named: "<#FFB52E><bold>BOMPLEK <site>"
  timer: "<#FFB52E><bold><seconds></bold></#FFB52E>"
  attack: "<#FFB52E><bold>AANVALLEN"
  defend: "<#9CC05A><bold>VERDEDIGEN"
  attack-hint: "<gray>Leg de bom op de plek van <team>"
  defend-hint: "<gray>Houd <team> weg van je bomplek"
  attack-hint-sites: "<gray>Leg de bom op plek <#FFB52E>A</#FFB52E> of <#FFB52E>B"
  defend-hint-sites: "<gray>Houd <team> weg van plek <#FFB52E>A</#FFB52E> en <#FFB52E>B"
  round-title: "<#D9C78F><bold>RONDE <round></bold></#D9C78F><dark_gray>/<max>"
  go: "<#9CC05A><bold>GO!"
  swap: "<#FFB52E><bold>WISSEL!</bold></#FFB52E> <gray>De teams ruilen van kant · geld terug op ⛁ <cash>"
  carrier: "<#FFB52E>»</#FFB52E> <player> <gray>heeft de bom"
  dropped: "<#FFB52E>»</#FFB52E> <#FFB52E>De bom ligt op de grond!"
  picked: "<#FFB52E>»</#FFB52E> <player> <gray>pakt de bom op"
  planting: "<#FFB52E><bold>BOM LEGGEN</bold></#FFB52E> <bar>"
  defusing: "<#9CC05A><bold>ONTMANTELEN</bold></#9CC05A> <bar>"
  planted: "<#FFB52E><bold>DE BOM LIGT!</bold></#FFB52E> <gray>Nog <white><seconds></white>s"
  planted-by: "<#FFB52E>»</#FFB52E> <player> <#FFB52E>legt de bom!"
  planted-by-site: "<#FFB52E>»</#FFB52E> <player> <#FFB52E>legt de bom op plek <#FFB52E><bold><site></bold></#FFB52E>!"
  defused-by: "<#FFB52E>»</#FFB52E> <player> <#9CC05A>ontmantelt de bom!"
  hint-plant: "<gray>Sluip met de bom in je hand op de <#FFB52E>bomplek"
  hint-kit: "<gray>Sluip bij de bom om hem te ontmantelen"
  out-title: "<red><bold>UIT"
  out-subtitle: "<gray>Kijk mee tot de volgende ronde"
  won-title: "<team> <#D9C78F><bold>WINT DE RONDE"
  end:
    elimination: "<gray>Alle tegenstanders uitgeschakeld"
    exploded: "<#FFB52E>De bom is ontploft"
    defused: "<#9CC05A>De bom is ontmanteld"
    time: "<gray>De tijd is op"
  bossbar:
    buy: "<#FFB52E>Koopfase</#FFB52E> <gray>· ronde <round>/<max> · nog <white><time>"
    live: "<#D9C78F>Ronde <round>/<max></#D9C78F> <gray>· nog <white><time>"
    planted: "<#FFB52E><bold>BOM GELEGD</bold></#FFB52E> <gray>· nog <white><time>"
    post: "<gray>Volgende ronde over <white><time>"
  hud-title: "<#D9C78F><bold>PAINTBALL</bold> <gray>· Verfbom"

bot:
  # Shown under a bot's name.
  description: "<gray>Bot · <level>"
  level:
    makkelijk: "<#9CC05A>Makkelijk"
    normaal: "<yellow>Normaal"
    moeilijk: "<gold>Moeilijk"
    meester: "<red>Meester"
  menu:
    title: "<#D9C78F>Paintball tegen bots"
    level-lore:
      makkelijk: "<gray>Mikt slordig en schiet traag"
      normaal: "<gray>Mikt redelijk en schiet vooruit op wie loopt"
      moeilijk: "<gray>Mikt goed en stapt opzij als je schiet"
      meester: "<gray>Bijna altijd raak. Succes!"
    size: "<white><n> tegen <n>"
    size-lore-alone: "<gray>Jij alleen tegen 1 bot"
    size-lore: "<gray>Jij + <allies> bots tegen <enemies> bots"
    chosen: "<#9CC05A>✔ Gekozen"
    click: "<gray>Klik om te kiezen"
    start: "<#9CC05A><bold>Start"
    start-lore: "<gray><level> <dark_gray>·</dark_gray> <white><n> tegen <n></white> <dark_gray>·</dark_gray> <gray>telt niet mee voor je stats"
