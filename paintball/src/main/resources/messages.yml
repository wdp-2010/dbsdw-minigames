# Paintball player messages (MiniMessage format).
# Raise "version" when texts change: servers with an older file get it backed up and replaced.
# Colours: khaki #D9C78F (headings), field green #9CC05A (good news), amber #FFB52E (alerts, numbers).
version: 6

game:
  name: "<#D9C78F><bold>Paintball"

# Mode names in the queue menus.
mode:
  tdm: "<#D9C78F>Teamgevecht"
  ctf: "<#D9C78F>Vlagroof"

item:
  gun: "<#D9C78F><bold>Paintgeweer</bold></#D9C78F> <gray>· rechtsklik om te vuren"
  practice-gun: "<#D9C78F><bold>Oefengeweer</bold></#D9C78F> <gray>· rechtsklik om te vuren"

# Icons come from the resource pack font dbsdw:hud: \uE000 paint drop (used in code), \uE001 shield,
# \uE002-\uE005 power-ups, \uE006 hit marker, \uE007 spawn protection, \uE008 team splat.
hud:
  title-tdm: "<#D9C78F><bold>PAINTBALL</bold> <gray>· Teamgevecht"
  title-ctf: "<#D9C78F><bold>PAINTBALL</bold> <gray>· Vlagroof"
  score: "<team><gray>: <white><bold><score>"
  time: "<gray>Tijd <white><time>"
  bossbar: "<#D9C78F>Nog <white><time></white> te gaan"
  protected: " <font:dbsdw:hud><white>\uE007</white></font> <aqua>Beschermd"
  shield: " <font:dbsdw:hud><white>\uE001</white></font>"
  buff: " <icon> <white><seconds>s"
  # Under the crosshair (subtitle) for the shooter.
  marker: "<font:dbsdw:hud><white>\uE006</white></font> <white><bold>RAAK!"
  marker-shield: "<font:dbsdw:hud><white>\uE001</white></font> <aqua><bold>SCHILD KAPOT!"
  eliminated: "<font:dbsdw:hud><white>\uE006</white></font> <#FFB52E><bold>UITGESCHAKELD</bold></#FFB52E> <white><victim>"
  streak: "<font:dbsdw:hud><white>\uE006</white></font> <#FFB52E><bold>OP DREEF!</bold></#FFB52E> <white><count></white> <gray>op rij"
  # Scope zoom level after a mouse-wheel notch while aiming.
  zoom: "<#D9C78F>Zoom <white><bold><level></bold></white><dark_gray>/<levels>"

out:
  title: "<red><bold>GERAAKT!"
  subtitle: "<gray>Terug in het veld over <white><seconds></white>s"

feed:
  out: "<dark_gray>✖</dark_gray> <shooter> <gray>schakelt</gray> <victim> <gray>uit"
  out-bounds: "<dark_gray>✖</dark_gray> <victim> <gray>liep het veld uit"

# Eliminations in a row without going out (3, 5, 10, ...).
streak:
  on-fire: "<#FFB52E>»</#FFB52E> <player> <gray>is</gray> <#FFB52E><bold>op dreef</bold></#FFB52E><gray>: <white><count></white> op rij!"
  unstoppable: "<#FFB52E>»</#FFB52E> <player> <gray>is</gray> <red><bold>niet te stoppen</bold></red><gray>: <white><count></white> op rij!"
  ended: "<#FFB52E>»</#FFB52E> <player> <gray>stopt de reeks van <victim> <gray>(<white><count></white>)"

# Flag events go to chat and, short, under the crosshair of everyone in the match.
flag:
  taken: "<#FFB52E>⚑</#FFB52E> <player> <gray>steelt de vlag van <flag><gray>!"
  dropped: "<#FFB52E>⚑</#FFB52E> <gray>De vlag van <flag> <gray>ligt op de grond!"
  returned: "<#FFB52E>⚑</#FFB52E> <player> <gray>brengt de vlag van <flag> <gray>terug."
  returned-auto: "<#FFB52E>⚑</#FFB52E> <gray>De vlag van <flag> <gray>is terug op de basis."
  captured: "<#FFB52E>⚑</#FFB52E> <player> <#FFB52E><bold>verovert de vlag van</bold></#FFB52E> <flag><#FFB52E><bold>!"
  status: "<team><gray>: <state>"
  state-home: "<#9CC05A>op de basis"
  state-carried: "<#FFB52E>bij <player>"
  state-dropped: "<red>op de grond (<seconds>s)"

powerup:
  # Under the crosshair when picked up.
  picked: "<icon> <#FFB52E><bold><powerup>!"
  icon:
    rapid_fire: "<font:dbsdw:hud><white>\uE002</white></font>"
    triple_shot: "<font:dbsdw:hud><white>\uE003</white></font>"
    speed: "<font:dbsdw:hud><white>\uE004</white></font>"
    shield: "<font:dbsdw:hud><white>\uE001</white></font>"
    repair: "<font:dbsdw:hud><white>\uE005</white></font>"
  rapid_fire: "Snelvuur"
  triple_shot: "Driedubbel schot"
  speed: "Sprint"
  shield: "Schild"
  repair: "EHBO-kit"

stat:
  eliminations: "Uitgeschakeld"
  outs: "Zelf geraakt"
  hits: "Treffers"
  shots: "Schoten"
  captures: "Vlaggen veroverd"
  returns: "Vlaggen gered"

result:
  score: "<#D9C78F><bold>Eindstand</bold></#D9C78F> <red_team> <white><bold><red></bold></white> <dark_gray>-</dark_gray> <white><bold><blue></bold></white> <blue_team>"
  score-ctf: "<#D9C78F><bold>Vlaggen</bold></#D9C78F> <red_team> <white><bold><red></bold></white> <dark_gray>-</dark_gray> <white><bold><blue></bold></white> <blue_team>"
  mvp: "<#FFB52E><bold>MVP</bold></#FFB52E> <name> <dark_gray>·</dark_gray> <white><count></white> <gray>uitgeschakeld, <white><hits></white> <gray>treffers"
  top-header: "<#D9C78F>Beste schutters:"
  top: "<gray> <rank>. <white><name></white> <dark_gray>·</dark_gray> <#FFB52E><count></#FFB52E> uitgeschakeld"
  # Sent to each player after the shared lines.
  you: "<#D9C78F>Jij:</#D9C78F> <white><eliminations></white> <gray>uitgeschakeld <dark_gray>·</dark_gray> <white><hits></white> <gray>treffers <dark_gray>·</dark_gray> <white><accuracy>%</white> <gray>raak <dark_gray>·</dark_gray> <gray>beste reeks <white><streak>"

# Shooting range in the lobby.
practice:
  title: "<#D9C78F><bold>OEFENTERREIN"
  hint: "<gray>Rechtsklik om te vuren · sluip om te richten · scroll om te zoomen"
  down: "<font:dbsdw:hud><white>\uE006</white></font> <#FFB52E><bold>DOELWIT NEER!"

# Playing against bots (/solo, or start alone in a room).
bot:
  # Shown under a bot's name.
  description: "<gray>Bot · <level>"
  level:
    makkelijk: "<#9CC05A>Makkelijk"
    normaal: "<yellow>Normaal"
    moeilijk: "<gold>Moeilijk"
    meester: "<red>Meester"
  menu:
    title: "<#D9C78F>Paintball tegen bots"
    level-lore:
      makkelijk: "<gray>Mikt slordig en schiet traag"
      normaal: "<gray>Mikt redelijk en schiet vooruit op wie loopt"
      moeilijk: "<gray>Mikt goed en stapt opzij als je schiet"
      meester: "<gray>Bijna altijd raak. Succes!"
    size: "<white><n> tegen <n>"
    size-lore-alone: "<gray>Jij alleen tegen 1 bot"
    size-lore: "<gray>Jij + <allies> bots tegen <enemies> bots"
    chosen: "<#9CC05A>✔ Gekozen"
    click: "<gray>Klik om te kiezen"
    start: "<#9CC05A><bold>Start"
    start-lore: "<gray><level> <dark_gray>·</dark_gray> <white><n> tegen <n></white> <dark_gray>·</dark_gray> <gray>telt niet mee voor je stats"
