# Paintball

# Mode names and every other text are in messages.yml.
tdm:
  min-per-team: 2
  max-per-team: 8
  # First team to this many eliminations wins: this many per player on the bigger team (bots count),
  # up to win-eliminations. 1v1 plays to 10, 2v2 to 20, 3v3 and up to 30. 0 = always win-eliminations.
  win-eliminations-per-player: 10
  win-eliminations: 30
  # After this, the team with the most eliminations wins (equal = draw).
  time-limit-minutes: 10

ctf:
  min-per-team: 2
  max-per-team: 8
  # First team to this many captures wins.
  win-captures: 3
  # After this, the team with the most captures wins (equal = draw).
  time-limit-minutes: 12
  # A dropped flag goes home by itself after this.
  flag-return-seconds: 30
  # Respawn wait in capture the flag (player.respawn-seconds is for team deathmatch).
  respawn-seconds: 7

player:
  hits-to-out: 3
  respawn-seconds: 3
  # Can't be hit after (re)spawning; shooting ends it early.
  spawn-protection-seconds: 2

gun:
  # 5 ticks = 4 shots per second.
  shot-interval-ticks: 5
  # Blocks per tick (vanilla snowball: 1.5). Drag stays vanilla.
  speed: 3.0
  # Share of vanilla gravity on a paintball: 1 = vanilla arc, 0.5 = half the drop, 0 = straight line.
  gravity: 0.5
  spread-degrees: 1.0
  # Sneak with the gun to aim through the scope: zoomed in, slower, and this much spread.
  scope-spread-degrees: 0.2
  # A paintball that hits nothing is removed after this (60 = 3 s).
  ball-lifetime-ticks: 60

powerups:
  # Power-ups appear on random floor that players can walk to from the team spawns (never on roofs or
  # in closed rooms), away from players, spawns and each other. Picked from: rapid_fire, triple_shot,
  # speed, shield, repair.
  enabled: [rapid_fire, triple_shot, speed, shield, repair]
  # How many lie on the field at once.
  max-active: 3
  # A new one appears this long after one is picked up.
  respawn-seconds: 30
  # Quiet help for the team that is behind: power-ups land a bit more often near its players, and near
  # them repair and shield come up more often. Grows with the score gap. 0 = off, 1 = normal, 2 = strong.
  catch-up: 1.0
  # Double fire rate.
  rapid-fire-seconds: 10
  # Each shot fires 3 paintballs in a small fan.
  triple-shot-seconds: 8
  triple-shot-fan-degrees: 4
  # Speed II.
  speed-seconds: 10
  # shield (next hit absorbed) and repair (one hit removed) have no duration.

splats:
  # Paint splats on blocks disappear after this.
  lifetime-seconds: 20
  # Oldest splats are removed above this many per match.
  max-per-arena: 300

practice:
  # Shooting range in the lobby: walking into the zone gives a gun, leaving takes it again.
  enabled: true
  world: world
  # Two corner blocks of the zone (both included).
  corner-1: [-8, -59, -9]
  corner-2: [8, -51, -39]
  # Pop-up dummies: x, y, z (feet) and yaw (0 = facing south, +Z).
  targets:
    - [-4.5, -58, -20.5, 0]
    - [0.5, -58, -25.5, 0]
    - [4.5, -58, -21.5, 0]
    - [-2.5, -58, -31.5, 0]
    - [3.5, -58, -34.5, 0]
  # A dummy sinks into the floor after this many hits and rises again after this long.
  target-hits: 3
  target-down-seconds: 3

# The shop modes (team deathmatch and capture the flag with a shop) unlock at this paintball level.
shop:
  unlock-level: 5
  # Cash in the shop modes and the bomb mode, per match (never saved).
  cash:
    start: 800
    max: 9000
    elimination: 300
    capture: 600
    return: 200
    # Bomb mode only: every player of the team that won or lost a round, and planting or defusing.
    round-win: 3000
    round-loss: 1900
    objective: 300

# Bomb mode (Verfbom): rounds of attack and defence, like the well-known tactical shooters. The bomb
# site is the defending team's flag spot, so every capture the flag arena works. No respawns in a
# round; the shop is open in the buy phase only. Sides swap after half of max-rounds.
bomb:
  unlock-level: 10
  min-per-team: 2
  max-per-team: 5
  win-rounds: 5
  # An even number; 4-4 after the last round is a draw.
  max-rounds: 8
  buy-seconds: 10
  round-seconds: 90
  round-end-seconds: 5
  plant-seconds: 4
  fuse-seconds: 35
  defuse-seconds: 6
  kit-defuse-seconds: 3
  site-radius: 4
