# Throwaway servers for end-to-end travel tests. Run them on node1 (the WDP host has no RAM to spare).
# Ports are bound to 127.0.0.1 only; each container has a hard memory cap.
# Console: echo '<command>' > tools/e2e/servers/<name>/console.in
# Run as your own user: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f tools/e2e/docker-compose.yml up -d
name: dbsdw-e2e

x-server: &server
  image: eclipse-temurin:25-jdk
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /data
  restart: "no"
  # Hard cap so a test server can never take memory from anything else on the host.
  mem_limit: 1536m
  memswap_limit: 1536m

services:
  survival:
    <<: *server
    command: ["sh", "-c", "rm -f console.in && mkfifo console.in && exec java -Xmx1G -jar /jars/paper.jar --nogui <>console.in"]
    volumes: ["./servers/survival:/data", "./servers/_jars:/jars:ro"]
    ports: ["127.0.0.1:25570:25565"]

  minigames:
    <<: *server
    command: ["sh", "-c", "rm -f console.in && mkfifo console.in && exec java -Xmx1G -jar /jars/paper.jar --nogui <>console.in"]
    volumes: ["./servers/minigames:/data", "./servers/_jars:/jars:ro"]
    ports: ["127.0.0.1:25571:25565"]

  folia:
    <<: *server
    profiles: ["folia"]
    command: ["sh", "-c", "rm -f console.in && mkfifo console.in && exec java -Xmx1G -jar /jars/folia.jar --nogui <>console.in"]
    volumes: ["./servers/folia:/data", "./servers/_jars:/jars:ro"]
    ports: ["127.0.0.1:25572:25565"]

  packhost:
    image: python:3.13-slim
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "-m", "http.server", "8000", "--directory", "/pack"]
    mem_limit: 128m
    volumes: ["./servers/pack:/pack:ro"]

  # Protocol translator for the bots: they speak 26.1, the servers see a real 26.3 client, so the
  # plugins run with exactly the settings live uses. Transfers are routed back through the proxy.
  viaproxy:
    <<: *server
    mem_limit: 768m
    memswap_limit: 768m
    command: ["java", "-Xmx512m", "-jar", "/jars/ViaProxy-3.4.14.jar", "cli",
              "--bind-address", "0.0.0.0:25565", "--target-address", "survival:25565",
              "--target-version", "26.3", "--auth-method", "NONE", "--rewrite-transfer-packets", "true"]
    volumes: ["./servers/viaproxy:/data", "./servers/_jars:/jars:ro"]

  # Second translator pointing straight at minigames, for replay checks (reconnecting with an old ticket).
  viaproxy-minigames:
    <<: *server
    mem_limit: 768m
    memswap_limit: 768m
    command: ["java", "-Xmx512m", "-jar", "/jars/ViaProxy-3.4.14.jar", "cli",
              "--bind-address", "0.0.0.0:25565", "--target-address", "minigames:25565",
              "--target-version", "26.3", "--auth-method", "NONE"]
    volumes: ["./servers/viaproxy-minigames:/data", "./servers/_jars:/jars:ro"]
