# Verstoppertje player messages (MiniMessage format).
# Raise "version" when texts change: servers with an older file get it backed up and replaced.
# Colours: khaki #D9C78F (headings), field green #9CC05A (good news), amber #FFB52E (alerts, numbers).
version: 5

game:
  name: "<#D9C78F><bold>Verstoppertje"

mode:
  klassiek: "<#D9C78F>Verstoppertje"

team:
  hiders: "<#9CC05A>Verstoppers</#9CC05A>"
  seekers: "<#FFB52E>Zoekers</#FFB52E>"

stat:
  found: "Verstoppers gevonden"
  hidden: "Nooit gevonden"

item:
  picked: "<gray>Je bent nu <white><block></white>."
  seeker: "<#FFB52E><bold>Zoekzwaard</bold> <gray>· sla op verdachte blokken"

hide:
  title: "<#9CC05A><bold>Verstop je!"
  subtitle: "<gray>Zoekers over <white><seconds></white>s"
  # Boss bar during the hiding time.
  bar: "<gray>Zoekers over <white><seconds></white>s <dark_gray>·</dark_gray> <gray>sta stil = blok <dark_gray>·</dark_gray> <white>E</white> <gray>meer blokken"

wait:
  title: "<#FFB52E><bold>Jij zoekt!"
  subtitle: "<gray>Ogen dicht... nog <white><seconds></white>s"

seek:
  title: "<#FFB52E><bold>Zoeken!"
  subtitle: "<gray>Sla op blokken die er niet thuishoren"

coming:
  title: "<red><bold>Ze komen eraan!"
  subtitle: "<gray>Blijf stil staan..."

build:
  placed: "<gray>Geplaatst <dark_gray>·</dark_gray> <gray>nog <white><left>"
  broken: "<gray>Gebroken <dark_gray>·</dark_gray> <gray>nog <white><left>"
  place-full: "<#FFB52E>Geen blokken meer"
  boxed-in: "<#FFB52E>Je kunt jezelf niet insluiten"
  boxes-other: "<#FFB52E>Je kunt een verstopper niet insluiten"
  break-full: "<#FFB52E>Breken op"

# Not "on": YAML reads that key as true.
solid:
  locked: "<#9CC05A>Vast als blok"
  loose: "<#FFB52E>Los: je beweegt!"
  # A hider in a hole they dug in the floor: they cannot lock there.
  floor: "<#FFB52E>Geen vast blok in een gegraven gat in de vloer"
  # Repeated in a hider's action bar while they are not a solid block.
  free: "<gray>Sta <white><seconds>s</white> stil om een vast blok te worden"

hint: "<#FFB52E>Piep!</#FFB52E> <gray>De verstoppers piepten"

# Boss bar while seeking (turns red in the last 30 seconds).
hud:
  bar: "<#9CC05A>Verstoppers <white><bold><hiders></bold></white> <dark_gray>·</dark_gray> <gray>tijd <white><time>"

found:
  title: "<red><bold>Gevonden!"
  subtitle: "<white><seeker></white> <gray>vond je · nu zoek jij mee"
  broadcast: "<#FFB52E>»</#FFB52E> <white><seeker></white> <gray>vond <white><hider></white>. Nog <white><left></white> verstopt."

result:
  hidden: "<#FFB52E>»</#FFB52E> <gray>Nooit gevonden: <white><players>"
  all-found: "<#FFB52E>»</#FFB52E> <gray>Iedereen is gevonden!"

personal:
  hidden: "<#9CC05A>Niemand vond jou!"
  found: "<gray>Gevonden door <white><seeker></white> na <white><time></white> <dark_gray>·</dark_gray> <gray>daarna vond je er <white><count></white>"
  seeker: "<gray>Jij vond <white><count></white> verstoppers."
